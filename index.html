<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Produktivitas Operator</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 900px; margin: auto; }
    .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
    button { padding: 10px 15px; margin: 5px; cursor: pointer; border: 1px solid #007bff; background: #007bff; color: white; border-radius: 4px; }
    button:hover { background: #0056b3; }
    input[type="text"] { padding: 10px; width: 60%; border: 1px solid #ccc; border-radius: 4px; }
    .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
    .input-group input { width: 100%; }
    #clock { font-size: 28px; font-weight: bold; text-align: center; color: #333; margin-bottom: 10px; }
    #status { text-align: center; font-size: 14px; color: green; height: 20px; margin-bottom: 10px; }
    
    /* Konfigurasi Kertas F4 & Tabel Print */
    #table-container { display: none; margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th, td { border: 1px solid black; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }

    @media print {
      @page { size: 215mm 330mm; margin: 15mm; }
      body * { visibility: hidden; }
      #table-container, #table-container * { visibility: visible; }
      #table-container { position: absolute; left: 0; top: 0; width: 100%; display: block !important; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <div id="clock">00:00:00</div>
    <div id="status"></div>
    
    <!-- Informasi Tempat dan Hari -->
    <div class="card">
      <h4>Data Pengamatan:</h4>
      <div class="input-group">
        <input type="text" id="inputTempat" placeholder="Masukkan Nama Tempat...">
        <input type="text" id="inputHari" placeholder="Masukkan Hari (Contoh: Senin)...">
      </div>
      <button onclick="resetData()" style="background: #dc3545; border-color:#dc3545;">🗑️ Reset Data</button>
    </div>
    
    <div style="text-align: center; margin-bottom: 20px;">
      <button onclick="toggleView('chart')" style="background: #28a745; border-color:#28a745;">Lihat Grafik</button>
      <button onclick="toggleView('table')" style="background: #17a2b8; border-color:#17a2b8;">Lihat Tabel / Cetak F4</button>
    </div>

    <!-- Area Grafik -->
    <div id="chart-container" class="card">
      <canvas id="productivityChart" height="100"></canvas>
    </div>

    <!-- Tombol Input Cepat -->
    <div class="card" id="button-group">
      <h4>Catat Aktivitas:</h4>
      <button onclick="recordEvent('Idle Time (Waktu Menganggur)')">Idle Time (Waktu Menganggur)</button>
      <button onclick="recordEvent('Produktif')">Produktif</button>
    </div>

    <!-- Input Manual & Tambah Tombol -->
    <div class="card">
      <h4>Ketikan Manual:</h4>
      <input type="text" id="manualInput" placeholder="Ketik aktivitas secara manual...">
      <button onclick="recordManual()">Simpan</button>
      
      <hr style="margin: 15px 0;">
      
      <h4>Tambah Tombol Baru:</h4>
      <input type="text" id="newButtonName" placeholder="Nama tombol baru...">
      <button onclick="addNewButton()" style="background: #ffc107; color: black; border-color:#ffc107;">+ Tambah Tombol</button>
    </div>
  </div>

  <!-- Area Laporan (Tabel) -->
  <div id="table-container">
    <h2 style="text-align: center;">Laporan Pengamatan Produktivitas</h2>
    <div style="margin-bottom: 10px;">
      <strong>Tempat:</strong> <span id="printTempat">-</span> <br>
      <strong>Hari:</strong> <span id="printHari">-</span>
    </div>
    <table id="dataTable">
      <thead>
        <tr>
          <th style="width: 5%; text-align: center;">No</th>
          <th style="width: 15%;">Hari</th>
          <th style="width: 20%;">Tempat</th>
          <th style="width: 15%;">Waktu</th>
          <th style="width: 45%;">Keterangan</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>

  <script>
    // URL Web App Anda
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwzNVcvqjDzfBaq--gM4Q6dv58YRpUASjeSIbxJH9w4ffBRxKqA0nQ7pUamzOQVHd0z/exec';

    // Jam Realtime
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('id-ID');
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Setup Chart.js
    const ctx = document.getElementById('productivityChart').getContext('2d');
    const yCategories = ['Idle Time (Waktu Menganggur)', 'Produktif'];
    
    let chart = new Chart(ctx, {
      type: 'line',
      data: { labels: [], datasets: [{ label: 'Aktivitas Operator', data: [], borderColor: '#007bff', backgroundColor: '#ff3333', showLine: false, pointRadius: 6, pointHoverRadius: 8 }] },
      options: { responsive: true, scales: { y: { type: 'category', labels: yCategories, offset: true } } }
    });

    let dataCount = 0;

    // Fungsi Utama Mencatat Data
    function recordEvent(keterangan) {
      const tempat = document.getElementById('inputTempat').value || "-";
      const hari = document.getElementById('inputHari').value || "-";
      const now = new Date();
      const timeStr = now.toLocaleTimeString('id-ID');
      
      // Update Y-axis grafik
      if (!chart.options.scales.y.labels.includes(keterangan)) { chart.options.scales.y.labels.push(keterangan); }

      // Masukkan ke Grafik
      chart.data.labels.push(timeStr);
      chart.data.datasets[0].data.push(keterangan);
      chart.update();

      // Masukkan ke Tabel HTML
      dataCount++;
      const tbody = document.querySelector('#dataTable tbody');
      const tr = document.createElement('tr');
      tr.innerHTML = `<td style="text-align:center;">${dataCount}</td><td>${hari}</td><td>${tempat}</td><td>${timeStr}</td><td>${keterangan}</td>`;
      tbody.appendChild(tr);

      // Kirim data ke Google Sheets
      kirimKeGoogleSheets(hari, tempat, timeStr, keterangan);
    }

    // Mengirim Data ke Sheets
    function kirimKeGoogleSheets(hari, tempat, waktu, keterangan) {
      const statusText = document.getElementById('status');
      statusText.innerText = 'Menyimpan data...';
      statusText.style.color = 'orange';

      const formData = new FormData();
      formData.append('action', 'record');
      formData.append('hari', hari);
      formData.append('tempat', tempat);
      formData.append('waktu', waktu);
      formData.append('keterangan', keterangan);

      fetch(scriptURL, { method: 'POST', body: formData })
        .then(response => {
          statusText.innerText = 'Data berhasil disimpan!';
          statusText.style.color = 'green';
          setTimeout(() => statusText.innerText = '', 3000);
        })
        .catch(error => {
          statusText.innerText = 'Gagal menyimpan data!';
          statusText.style.color = 'red';
        });
    }

    // Fungsi Reset Data dengan Konfirmasi
    function resetData() {
      const isConfirmed = confirm("⚠️ PERINGATAN: Apakah Anda yakin ingin mereset/menghapus seluruh data pengamatan pada hari ini di grafik, tabel, dan Spreadsheet?");
      
      if (isConfirmed) {
        // Reset UI lokal (Grafik dan Tabel)
        document.querySelector('#dataTable tbody').innerHTML = '';
        chart.data.labels = [];
        chart.data.datasets[0].data = [];
        chart.update();
        dataCount = 0;

        // Reset data di Spreadsheet via API
        const statusText = document.getElementById('status');
        statusText.innerText = 'Mereset data...';
        statusText.style.color = 'orange';

        const formData = new FormData();
        formData.append('action', 'reset');

        fetch(scriptURL, { method: 'POST', body: formData })
          .then(response => {
            statusText.innerText = 'Data berhasil direset!';
            statusText.style.color = 'blue';
            setTimeout(() => statusText.innerText = '', 3000);
          })
          .catch(error => {
            statusText.innerText = 'Gagal mereset data!';
            statusText.style.color = 'red';
          });
      }
    }

    // Fungsi Input Manual & Tambah Tombol
    function recordManual() {
      const input = document.getElementById('manualInput');
      if (input.value.trim() !== '') { recordEvent(input.value.trim()); input.value = ''; }
    }
    function addNewButton() {
      const name = document.getElementById('newButtonName').value.trim();
      if (name !== '') {
        const btnGroup = document.getElementById('button-group');
        const btn = document.createElement('button');
        btn.innerText = name;
        btn.onclick = function() { recordEvent(name); };
        btnGroup.appendChild(btn);
        document.getElementById('newButtonName').value = '';
      }
    }

    // Navigasi Tampilan dan Cetak
    function toggleView(view) {
      if (view === 'chart') {
        document.getElementById('chart-container').style.display = 'block';
        document.getElementById('table-container').style.display = 'none';
      } else {
        document.getElementById('chart-container').style.display = 'none';
        document.getElementById('table-container').style.display = 'block';
        
        // Memasukkan inputan tempat & hari ke header cetak
        document.getElementById('printTempat').innerText = document.getElementById('inputTempat').value || "-";
        document.getElementById('printHari').innerText = document.getElementById('inputHari').value || "-";
        
        setTimeout(() => { window.print(); }, 300);
      }
    }
  </script>
</body>
</html>
